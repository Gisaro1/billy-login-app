<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <script src="https://cdn.tailwindcss.com"></script>
    <title>Landing Page</title>
</head>
<body class="bg-gray-950 min-h-screen overflow-x-hidden">
    <div class="w-full py-4 px-3">
        <div class="flex flex-col md:flex-row justify-between items-center bg-gray-800 p-4 w-full rounded-xl mb-4">
        <h3 class="text-white text-xl font-bold text-center md:text-left">Welcome <span id="names" class="text-green-400"></span></h3>
         <div class="flex gap-3 justify-center  w-full md:w-auto md:justify-end">
            <button class="addbox bg-green-600 text-white px-4 py-2 rounded-lg font-bold hover:bg-green-700" id="addBox" onclick="addNewBox()">Add a BOX</button>
            <button class="hidden bg-red-600 text-white px-4 py-2 rounded-lg font-bold hover:bg-red-700" id="removeBtn" onclick="deleteAll()">Delete all</button>
            <button onclick="logOut()" class="bg-gray-600 text-white px-4 py-2 rounded-lg font-bold hover:bg-gray-500">Logout</button>
        </div>
    </div>
    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 w-full" id="container"></div>
    </div>
    <script src="index.js"></script>
   </body>
</html>
